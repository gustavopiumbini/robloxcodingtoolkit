<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-label="Architecture: your agent works in Roblox Studio through the Studio MCP">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#15120D"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#E8B86D"/>
    </marker>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 2px; }
    .code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>
  <rect width="1280" height="520" rx="18" fill="url(#bg)"/>
  <text x="56" y="62" class="mono" font-size="13" font-weight="700" fill="#E8B86D">02 / ARCHITECTURE</text>
  <text x="1224" y="62" class="mono" font-size="12" fill="#8A8F98" text-anchor="end">AGENT · STUDIO MCP · STUDIO</text>
  <text x="54" y="128" class="sans" font-size="46" font-weight="900" fill="#F4F1EA">The server decides. The client asks.</text>

  <!-- Agent -->
  <g transform="translate(56 170)">
    <rect width="300" height="220" rx="12" fill="#121214" stroke="#3B3426"/>
    <text x="24" y="36" class="mono" font-size="11" fill="#E8B86D">YOUR AGENT</text>
    <text x="24" y="76" class="sans" font-size="24" font-weight="800" fill="#F4F1EA">Claude Code · Codex</text>
    <text x="24" y="116" class="sans" font-size="15" fill="#B9BCC2">25 Roblox skills</text>
    <text x="24" y="144" class="sans" font-size="15" fill="#B9BCC2">AGENTS.md project rules</text>
    <text x="24" y="172" class="sans" font-size="15" fill="#B9BCC2">rbxkit: init · docs · mcp</text>
  </g>

  <!-- MCP -->
  <g transform="translate(470 170)">
    <rect width="320" height="220" rx="12" fill="#121214" stroke="#3B3426"/>
    <text x="24" y="36" class="mono" font-size="11" fill="#E8B86D">STUDIO MCP</text>
    <text x="24" y="78" class="code" font-size="16" fill="#F4F1EA">execute_luau</text>
    <text x="24" y="110" class="code" font-size="16" fill="#F4F1EA">multi_edit</text>
    <text x="24" y="142" class="code" font-size="16" fill="#F4F1EA">start_stop_play</text>
    <text x="24" y="174" class="code" font-size="16" fill="#F4F1EA">screen_capture</text>
    <text x="190" y="78" class="sans" font-size="14" fill="#8A8F98">install, build</text>
    <text x="190" y="110" class="sans" font-size="14" fill="#8A8F98">edit scripts</text>
    <text x="190" y="142" class="sans" font-size="14" fill="#8A8F98">play test</text>
    <text x="190" y="174" class="sans" font-size="14" fill="#8A8F98">look &amp; judge</text>
  </g>

  <!-- Studio -->
  <g transform="translate(904 170)">
    <rect width="320" height="220" rx="12" fill="#121214" stroke="#3B3426"/>
    <text x="24" y="36" class="mono" font-size="11" fill="#E8B86D">ROBLOX STUDIO</text>
    <text x="24" y="78" class="code" font-size="15" fill="#F4F1EA">ServerScriptService</text>
    <text x="24" y="110" class="code" font-size="15" fill="#F4F1EA">ReplicatedStorage</text>
    <text x="24" y="142" class="code" font-size="15" fill="#F4F1EA">StarterPlayerScripts</text>
    <text x="24" y="174" class="code" font-size="15" fill="#F4F1EA">ServerStorage.DevTools</text>
  </g>

  <g stroke="#E8B86D" stroke-width="1.5" fill="none">
    <line x1="360" y1="280" x2="464" y2="280" marker-end="url(#arrow)"/>
    <line x1="794" y1="280" x2="898" y2="280" marker-end="url(#arrow)"/>
    <path d="M1064 394 C 1064 470, 206 470, 206 400" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  </g>
  <text x="412" y="268" class="mono" font-size="11" fill="#B9BCC2" text-anchor="middle">ASKS</text>
  <text x="846" y="268" class="mono" font-size="11" fill="#B9BCC2" text-anchor="middle">CHANGES</text>
  <rect x="410" y="440" width="460" height="30" rx="15" fill="#0B0D10"/>
  <text x="640" y="460" class="mono" font-size="11" fill="#E8B86D" text-anchor="middle">LINT · OUTPUT · SCREENSHOTS → BACK TO THE AGENT</text>
</svg>
