<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-label="Workflow: describe, plan, build, verify">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#15120D"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 2.5px; }
    .sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>
  <rect width="1280" height="440" rx="18" fill="url(#bg)"/>
  <text x="56" y="62" class="mono" font-size="13" font-weight="700" fill="#E8B86D">01 / WORKFLOW</text>
  <text x="1224" y="62" class="mono" font-size="12" fill="#8A8F98" text-anchor="end">IDEA · CODE · STUDIO</text>
  <text x="54" y="134" class="sans" font-size="50" font-weight="900" fill="#F4F1EA">Describe it. Build it. Verify it.</text>

  <g class="sans">
    <g transform="translate(56 184)">
      <rect width="262" height="132" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="22" y="34" class="mono" font-size="11" fill="#E8B86D">01 / INTENT</text>
      <text x="22" y="74" font-size="22" font-weight="800" fill="#F4F1EA">Describe the feature</text>
      <text x="22" y="102" font-size="15" fill="#8A8F98">Plain language, any skill level</text>
    </g>
    <g transform="translate(366 184)">
      <rect width="262" height="132" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="22" y="34" class="mono" font-size="11" fill="#E8B86D">02 / PLAN</text>
      <text x="22" y="74" font-size="22" font-weight="800" fill="#F4F1EA">Split client/server</text>
      <text x="22" y="102" font-size="15" fill="#8A8F98">Remotes, data, UI, assets</text>
    </g>
    <g transform="translate(676 184)">
      <rect width="262" height="132" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="22" y="34" class="mono" font-size="11" fill="#E8B86D">03 / BUILD</text>
      <text x="22" y="74" font-size="22" font-weight="800" fill="#F4F1EA">Code + 3D in Studio</text>
      <text x="22" y="102" font-size="15" fill="#8A8F98">Template modules, DevTools</text>
    </g>
    <g transform="translate(986 184)">
      <rect width="238" height="132" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="22" y="34" class="mono" font-size="11" fill="#E8B86D">04 / VERIFY</text>
      <text x="22" y="74" font-size="22" font-weight="800" fill="#F4F1EA">Prove it works</text>
      <text x="22" y="102" font-size="15" fill="#8A8F98">Lint, types, play test</text>
    </g>
  </g>
  <g stroke="#E8B86D" stroke-opacity="0.55">
    <line x1="318" y1="250" x2="366" y2="250"/><circle cx="342" cy="250" r="3" fill="#E8B86D"/>
    <line x1="628" y1="250" x2="676" y2="250"/><circle cx="652" cy="250" r="3" fill="#E8B86D"/>
    <line x1="938" y1="250" x2="986" y2="250"/><circle cx="962" cy="250" r="3" fill="#E8B86D"/>
  </g>
  <text x="56" y="384" class="mono" font-size="12" fill="#8A8F98">ASK / PLAN / IMPLEMENT / LINT / PLAY TEST</text>
  <line x1="1110" y1="380" x2="1216" y2="380" stroke="#E8B86D" stroke-opacity="0.7"/>
  <path d="M1206 374 L1216 380 L1206 386" fill="none" stroke="#E8B86D" stroke-opacity="0.7"/>
</svg>
