<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-label="Roblox Vibe Coding Toolkit">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#15120D"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.55" r="0.45">
      <stop offset="0" stop-color="#E8B86D" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#E8B86D" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F3D29A"/>
      <stop offset="1" stop-color="#A9783A"/>
    </linearGradient>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 3px; }
    .sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>
  <rect width="1280" height="560" rx="18" fill="url(#bg)"/>
  <rect width="1280" height="560" rx="18" fill="url(#grid)"/>
  <rect width="1280" height="560" rx="18" fill="url(#glow)"/>

  <text x="64" y="76" class="mono" font-size="15" font-weight="700" fill="#E8B86D">R / V</text>
  <text x="150" y="76" class="mono" font-size="13" fill="#8A8F98">ROBLOX DEVELOPMENT TOOLKIT</text>
  <rect x="64" y="94" width="76" height="2" fill="#E8B86D"/>
  <text x="1216" y="76" class="mono" font-size="13" fill="#8A8F98" text-anchor="end">CLAUDE CODE / CODEX / ROBLOX STUDIO</text>
  <rect x="64" y="110" width="1152" height="1" fill="#FFFFFF" fill-opacity="0.08"/>

  <text x="64" y="186" class="mono" font-size="15" fill="#E8B86D">SKILLS. TEMPLATE. 3D BUILD. VERIFY.</text>
  <text x="60" y="270" class="sans" font-size="76" font-weight="900" fill="#F4F1EA" textLength="640" lengthAdjust="spacingAndGlyphs">ROBLOX VIBE CODING</text>
  <text x="56" y="408" class="sans" font-size="150" font-weight="900" fill="#F4F1EA" textLength="650" lengthAdjust="spacingAndGlyphs">TOOLKIT</text>

  <g transform="translate(1000 300)">
    <ellipse rx="230" ry="88" fill="none" stroke="#E8B86D" stroke-opacity="0.22" transform="rotate(-18)"/>
    <ellipse rx="190" ry="150" fill="none" stroke="#E8B86D" stroke-opacity="0.12" transform="rotate(32)"/>
    <circle cx="214" cy="-104" r="3.5" fill="#F3D29A"/>
    <circle cx="-170" cy="96" r="2.5" fill="#E8B86D"/>
    <circle r="124" fill="#0E0F12" stroke="url(#ring)" stroke-width="2.5"/>
    <circle r="108" fill="none" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <!-- isometric brick -->
    <g transform="translate(0 -6)" stroke="#E8B86D" stroke-width="2.5" stroke-linejoin="round">
      <path d="M0 -62 L62 -28 L0 6 L-62 -28 Z" fill="#E8B86D" fill-opacity="0.18"/>
      <path d="M-62 -28 L-62 34 L0 68 L0 6 Z" fill="#E8B86D" fill-opacity="0.07"/>
      <path d="M62 -28 L62 34 L0 68 L0 6 Z" fill="#E8B86D" fill-opacity="0.11"/>
      <ellipse cx="-22" cy="-30" rx="13" ry="7" fill="none"/>
      <ellipse cx="22" cy="-30" rx="13" ry="7" fill="none"/>
    </g>
    <text transform="translate(-31 26) skewY(28.7)" text-anchor="middle" y="10" class="mono" font-size="28" font-weight="700" fill="#F3D29A" letter-spacing="0">&gt;_</text>
  </g>

  <rect x="64" y="468" width="1152" height="1" fill="#FFFFFF" fill-opacity="0.08"/>
  <text x="64" y="506" class="mono" font-size="12" fill="#8A8F98">SKILLS</text>
  <text x="200" y="506" class="mono" font-size="12" fill="#8A8F98">TEMPLATE</text>
  <text x="354" y="506" class="mono" font-size="12" fill="#8A8F98">3D BUILD</text>
  <text x="508" y="506" class="mono" font-size="12" fill="#8A8F98">STUDIO MCP</text>
  <rect x="1072" y="452" width="144" height="1.5" fill="#E8B86D" fill-opacity="0.7"/>
  <text x="1216" y="506" class="mono" font-size="12" fill="#E8B86D" text-anchor="end">DESCRIBE IT. SHIP IT IN STUDIO.</text>
</svg>
