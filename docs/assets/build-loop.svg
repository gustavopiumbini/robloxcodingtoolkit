<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-label="3D build loop: plan, block out, detail, audit, look, fix">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0D10"/>
      <stop offset="1" stop-color="#15120D"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#E8B86D"/>
    </marker>
  </defs>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 2px; }
    .sans { font-family: "Inter", "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
  </style>
  <rect width="1280" height="460" rx="18" fill="url(#bg)"/>
  <text x="56" y="62" class="mono" font-size="13" font-weight="700" fill="#E8B86D">03 / 3D BUILD</text>
  <text x="1224" y="62" class="mono" font-size="12" fill="#8A8F98" text-anchor="end">SCALE · SILHOUETTE · DETAIL · LIGHT</text>
  <text x="54" y="128" class="sans" font-size="46" font-weight="900" fill="#F4F1EA">Plan. Block out. Detail. Review.</text>

  <g class="sans">
    <g transform="translate(56 176)"><rect width="176" height="120" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="18" y="32" class="mono" font-size="11" fill="#E8B86D">01 / PLAN</text>
      <text x="18" y="70" font-size="20" font-weight="800" fill="#F4F1EA">Scale &amp; style</text>
      <text x="18" y="96" font-size="14" fill="#8A8F98">Avatar 5.5, palette</text></g>
    <g transform="translate(252 176)"><rect width="176" height="120" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="18" y="32" class="mono" font-size="11" fill="#E8B86D">02 / BLOCK OUT</text>
      <text x="18" y="70" font-size="20" font-weight="800" fill="#F4F1EA">Silhouette</text>
      <text x="18" y="96" font-size="14" fill="#8A8F98">Big masses first</text></g>
    <g transform="translate(448 176)"><rect width="176" height="120" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="18" y="32" class="mono" font-size="11" fill="#E8B86D">03 / DETAIL</text>
      <text x="18" y="70" font-size="20" font-weight="800" fill="#F4F1EA">Depth</text>
      <text x="18" y="96" font-size="14" fill="#8A8F98">Trims, insets, props</text></g>
    <g transform="translate(644 176)"><rect width="176" height="120" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="18" y="32" class="mono" font-size="11" fill="#E8B86D">04 / AUDIT</text>
      <text x="18" y="70" font-size="20" font-weight="800" fill="#F4F1EA">Clean build</text>
      <text x="18" y="96" font-size="14" fill="#8A8F98">Z-fighting, budget</text></g>
    <g transform="translate(840 176)"><rect width="176" height="120" rx="10" fill="#121214" stroke="#3B3426"/>
      <text x="18" y="32" class="mono" font-size="11" fill="#E8B86D">05 / LOOK</text>
      <text x="18" y="70" font-size="20" font-weight="800" fill="#F4F1EA">Screenshots</text>
      <text x="18" y="96" font-size="14" fill="#8A8F98">Iso, front, close</text></g>
    <g transform="translate(1036 176)"><rect width="188" height="120" rx="10" fill="#1A1710" stroke="#E8B86D" stroke-opacity="0.8"/>
      <text x="18" y="32" class="mono" font-size="11" fill="#E8B86D">06 / SCORE</text>
      <text x="18" y="70" font-size="20" font-weight="800" fill="#F4F1EA">Rubric ≥ 4/5</text>
      <text x="18" y="96" font-size="14" fill="#8A8F98">7 quality criteria</text></g>
  </g>
  <g stroke="#E8B86D" stroke-opacity="0.55">
    <line x1="232" y1="236" x2="252" y2="236"/><line x1="428" y1="236" x2="448" y2="236"/>
    <line x1="624" y1="236" x2="644" y2="236"/><line x1="820" y1="236" x2="840" y2="236"/>
    <line x1="1016" y1="236" x2="1036" y2="236"/>
  </g>
  <path d="M1130 300 C 1130 372, 536 372, 536 304" fill="none" stroke="#E8B86D" stroke-width="1.5" stroke-dasharray="5 6" marker-end="url(#arrow)"/>
  <text x="833" y="388" class="mono" font-size="11" fill="#B9BCC2" text-anchor="middle">FIX THE LOWEST SCORE · MAX 3 ITERATIONS</text>
</svg>
